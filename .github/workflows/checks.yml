name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Backend
        run: |
          python -m pip install -r backend/requirements-dev.txt
          ruff check backend scripts
          pytest backend/tests -q
      - name: Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Veröffentlichung prüfen
        run: python scripts/check_secrets.py --worktree --history
      - name: Stack starten und prüfen
        run: |
          python scripts/setup_stack.py
          python scripts/check_stack.py --require-n8n
      - name: Browser
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          node browser-smoke.mjs
      - name: Testartefakte
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: docs/screenshots
