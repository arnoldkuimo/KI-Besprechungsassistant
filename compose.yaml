name: besprechungsprotokolle
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Zuerst das Setup ausführen}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U meetings -d meetings"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://meetings:${POSTGRES_PASSWORD}@db:5432/meetings
      PROVIDER: ${PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gpt-transcribe}
      WORKFLOW_MODE: n8n
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN:?Zuerst das Setup ausführen}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/meeting-notes
      ALLOWED_ORIGINS: '["http://localhost:${APP_PORT:-8030}","http://127.0.0.1:${APP_PORT:-8030}"]'
    ports:
      - "127.0.0.1:${APP_PORT:-8030}:8030"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8030/api/health')"]
      interval: 10s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.4
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5680}/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Zuerst das Setup ausführen}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:${N8N_PORT:-5680}:5678"
    volumes:
      - workflow_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    restart: unless-stopped
volumes:
  database:
  uploads:
  workflow_data:
